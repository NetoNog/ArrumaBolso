<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="appBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#06090F"/>
    </linearGradient>

    <!-- Luxury Ambient Rim Gradient -->
    <linearGradient id="appRim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Radiant Gold Coin Gradient -->
    <linearGradient id="appCoin" x1="32" y1="7" x2="32" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Luminous Emerald Trim -->
    <linearGradient id="appEmerald" x1="20" y1="36.5" x2="44" y2="36.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Obsidian Wallet Body Back -->
    <linearGradient id="appWalletBack" x1="7" y1="23" x2="57" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Obsidian Wallet Front Pocket -->
    <linearGradient id="appWalletFront" x1="32" y1="31" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A11"/>
    </linearGradient>
  </defs>

  <!-- Squircle Canvas with Ambient Sheen -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#appBg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" stroke="url(#appRim)" stroke-width="2" fill="none"/>

  <!-- Golden Concentric Coin entering wallet pocket -->
  <g id="coin">
    <!-- Coin Body with radial highlight -->
    <circle cx="32" cy="19" r="11.5" fill="url(#appCoin)"/>
    <!-- Inner Concentric Ring -->
    <circle cx="32" cy="19" r="6.8" stroke="#070A11" stroke-width="2.4" fill="none"/>
    <!-- Center Core -->
    <circle cx="32" cy="19" r="2.2" fill="#070A11"/>
  </g>

  <!-- Obsidian Wallet Body (Back) -->
  <rect x="7" y="23" width="50" height="33" rx="7" fill="url(#appWalletBack)" stroke="#334155" stroke-width="2.2"/>

  <!-- Front Pocket Slit (covers lower half of coin, showing it entering inside) -->
  <path
    d="M7 30.5C15 36 23 38.5 32 38.5C41 38.5 49 36 57 30.5V49C57 52.866 53.866 56 50 56H14C10.134 56 7 52.866 7 49V30.5Z"
    fill="url(#appWalletFront)"
    stroke="#475569"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- Luminous Emerald Trim Accent on Pocket Lip -->
  <path
    d="M20 36.5C23.6 38 27.8 39 32 39C36.2 39 40.4 38 44 36.5"
    stroke="url(#appEmerald)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Golden Minimalist Clasp with Rivet -->
  <rect x="45" y="41" width="9" height="6" rx="1.6" fill="url(#appCoin)"/>
  <circle cx="48.5" cy="44" r="1" fill="#070A11"/>
</svg>
